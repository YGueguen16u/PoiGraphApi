
services:
  postgres_database:
    container_name: pg_db
    build:
      dockerfile: dockerfiles/Dockerfile_postgres
      context: .
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./data/sql:/dump-data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=poi_db
    ports:
      - 5432:5432
  
  notebook:
    container_name: spark_notebook
    build:
      dockerfile: dockerfiles/Dockerfile_notebook
      context: .
    environment:
      - NB_USER=poi_project
      - CHOWN_HOME=yes
      - CHOWN_EXTRA=/usr/local/spark/jars/
    volumes:
      - ./src:/src
      - ./src/notebooks:/home/poi_project/work
      - ./data/raw:/home/poi_project/work/data/raw
    ports:
      - 8888:8888
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='' --NotebookApp.password=''